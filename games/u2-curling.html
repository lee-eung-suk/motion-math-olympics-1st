<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>스톤을 굴려 10만들기 컬링 · 종목 2</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <div class="hud-actions">
      <button class="home-btn" id="homeBtn">🏠</button>
      <a class="home-btn" id="portalBtn" href="https://motion-math-olympics-portal.vercel.app" title="포털로 돌아가기">🌐</a>
    </div>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🥌 스톤을 굴려 10만들기 컬링</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <img class="countdown-char" src="../assets/char_u2_curling.png" alt="">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <h2 id="resultTitle">결과</h2>
    <div class="medal" id="resultMedal">🥉</div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0개</div><div class="label">기록</div></div>
      <div class="stat-box"><div class="num" id="statBest">0개</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, snapshotCanvas, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, toMirroredCanvas, loadImage,
  AutoDifficulty, drawLevelBadge, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, spawnParticles, updateParticles, drawParticles,
  spawnPopup, updatePopups, drawPopups,
  spawnBigPopup, updateBigPopups, drawBigPopups,
  InputMode, PointerInput, StartGate, drawFallbackBackground,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, drawHudBanner, popScale, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=7";
requestWakeLock();

const UNIT = "u2";
const TITLE = "스톤을 굴려 10만들기 컬링";
const RECORD_SUFFIX = "번 성공";
const MEDALS = { bronze: 5, silver: 9, gold: 13 };
const mode = InputMode.get();
// 규칙: 십틀(10칸)에 이미 채워진 수를 보여주고, "채워진 수 + ? = 10"의 보수 하나만 맞히면 된다.
// 예전에는 스톤 3개의 점수를 더해 10을 만들어야 해서 초1에게 세 수의 덧셈을 요구했고 성공률이 너무 낮았다.
const ATTEMPTS = 2;                 // 한 라운드에 던질 수 있는 횟수
// 하우스를 동심원 3개 링으로 나누고 링마다 후보 수를 적는다. 스톤은 곧게만 굴러가므로
// (부채꼴로 나누면 좌·우 구역에는 아예 닿을 수 없다) "얼마나 세게 미느냐" = "어느 수를 고르느냐"가 된다.
const RINGS = 3;
const PINCH_THRESHOLD = 0.06; // 정규화 좌표 기준 엄지-검지 거리

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
window.addEventListener("resize", () => { dims = fitCanvasToScreen(canvas); });

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";

document.getElementById("homeBtn").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });
document.getElementById("homeBtn2").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });
document.getElementById("portalBtn").addEventListener("click", () => { bgm.stop(); });

function houseGeom() {
  const { w, h } = dims;
  // 상단에 십틀(10칸 틀)이 들어가므로 하우스를 화면 중앙쯤으로 내려 서로 겹치지 않게 한다.
  const cx = w / 2, cy = h * 0.47;
  const R = Math.min(w, h) * 0.20;
  return { cx, cy, R };
}
// 스톤 시작 위치(홈) — 아래 파워 게이지와 겹치지 않도록 화면 하단보다 살짝 위에 둔다.
function stoneHomePos() {
  const { w, h } = dims;
  return { x: w / 2, y: h * 0.78 };
}
// 레벨이 올라갈수록 하우스가 작아지고, 레벨1에서만 정답 구역을 반짝여 알려 준다.
function roundConfigForLevel(level) {
  if (level === 1) return { houseScale: 1.2, filledMin: 5, filledMax: 9, hint: true };
  if (level === 2) return { houseScale: 1.0, filledMin: 2, filledMax: 9, hint: false };
  return { houseScale: 0.86, filledMin: 1, filledMax: 9, hint: false };
}

const handTracker = new HandTracker();
let pointerInput = null;
let stoneImg = null;
let charImg = null;
loadImage("../assets/char_u2_curling.png").then((img) => { charImg = img; }).catch(() => {});
loadImage("../assets/stone.png").then((img) => { stoneImg = img; }).catch(() => {});

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";
  document.getElementById("raiseIcon").innerHTML = mode === "motion" ? '<img src="../assets/char_cheer.png" alt="">' : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, combo, maxCombo, playEndAt, introUntil = 0, charFlashUntil = 0;
let filledVal, needVal, ringVals, attemptsLeft, stone, roundOver;
let charging = false, wasPressed = false, chargeStartAt = 0;
let particles = [], popups = [], bigPopups = [], confetti = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
let recIndicator = document.getElementById("recIndicator");

function newStone() {
  const home = stoneHomePos();
  stone = { x: home.x, y: home.y, vx: 0, vy: 0, moving: false, rot: 0, settled: false };
  charging = true;
  chargeStartAt = performance.now();
}
// 라운드 1개 = 보수 문제 1개. 십틀에 채워진 수(filledVal)를 보여주고 빈칸 수(needVal)를 맞히면 성공.
function newRound() {
  const cfg = roundConfigForLevel(autoDiff.level);
  filledVal = randInt(cfg.filledMin, cfg.filledMax);
  needVal = 10 - filledVal;
  // 정답과 가까운 수들로 나머지 구역을 채워, 찍기보다 실제로 세어 보게 만든다
  const pool = [];
  for (let v = 1; v <= 9; v++) if (v !== needVal) pool.push(v);
  pool.sort((a, b) => Math.abs(a - needVal) - Math.abs(b - needVal));
  const near = shuffle(pool.slice(0, cfg.hint ? 6 : 4)).slice(0, RINGS - 1);
  ringVals = near;
  ringVals.splice(Math.floor(Math.random() * RINGS), 0, needVal);
  attemptsLeft = ATTEMPTS;
  roundOver = false;
  newStone();
}

// 스톤이 멈춘 곳이 어느 링인지 — 0이 가장 안쪽
function ringIndexAt(dist, R) {
  return Math.min(RINGS - 1, Math.floor((dist / R) * RINGS));
}

// 숫자마다 새로 튀어오르도록: 클래스를 지웠다가 강제 리플로우 후 다시 붙여 countPop 애니메이션을
// 처음부터 재생시킨다. 3→2→1로 색도 바뀌어(파랑→노랑→빨강) 갈수록 긴장감이 올라가는 느낌을 준다.
const COUNT_COLORS = { 3: "#4cc9f0", 2: "#ffd166", 1: "#ff5d5d" };
function popCountNum(numEl, n) {
  numEl.textContent = n;
  numEl.style.color = COUNT_COLORS[n] || "#ffd166";
  numEl.classList.remove("pop");
  void numEl.offsetWidth;
  numEl.classList.add("pop");
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  popCountNum(numEl, n);
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      popCountNum(numEl, n);
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(AutoDifficulty.startLevelFromHighScore(prev));
  count = 0; combo = 0; maxCombo = 0;
  particles = []; popups = []; bigPopups = [];
  const INTRO_MS = 2600;
  introUntil = performance.now() + INTRO_MS;
  playEndAt = performance.now() + 60000 + INTRO_MS;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function roundSuccess() {
  roundOver = true;
  count++; combo++;
  if (combo > maxCombo) { maxCombo = combo; comboShot.capture(canvas); }
  autoDiff.reportCorrect();
  autoRec.trigger();
  const { cx, cy } = houseGeom();
  spawnParticles(particles, cx, cy, { count: 30, colors: ["#ffd166", "#f59e0b", "#fff"], speed: 300, life: 600 });
    spawnConfetti(confetti, cx, cy, 34);
  spawnBigPopup(bigPopups, dims.w / 2, dims.h * 0.62, `${filledVal} + ${needVal} = 10!`, "#ffd166");
  charFlashUntil = performance.now() + 500; // 정답 순간에만 캐릭터가 잠깐 등장(메인 게임 중엔 숨김)
  shake.trigger(6, 160);
  if (!isMuted()) { sound.success(); if (combo === 3) sound.comboUp(); if (combo >= 5 && combo % 5 === 0) sound.fever(); }
  setTimeout(() => { if (state === "playing") newRound(); }, 1000);
}
// 한 번 빗나가도 바로 실패시키지 않고 기회를 한 번 더 준다(초1 기준으로 관대하게)
function attemptFail(msg) {
  attemptsLeft--;
  spawnPopup(popups, dims.w / 2, dims.h * 0.66, msg, "#ef476f");
  if (!isMuted()) sound.wrong();
  if (attemptsLeft <= 0) { roundFail(); return; }
  setTimeout(() => { if (state === "playing" && !roundOver) newStone(); }, 700);
}
function roundFail() {
  roundOver = true;
  combo = 0;
  autoDiff.reportWrong();
  spawnBigPopup(bigPopups, dims.w / 2, dims.h * 0.62, `정답은 ${needVal}!`, "#ef476f");
  setTimeout(() => { if (state === "playing") newRound(); }, 1200);
}

function launchStone(vx, vy) {
  stone.vx = vx; stone.vy = vy; stone.moving = true;
  if (!isMuted()) sound.swoosh();
}

function settleStone() {
  stone.moving = false; stone.settled = true;
  const { cx, cy, R } = houseGeom();
  const cfg = roundConfigForLevel(autoDiff.level);
  const dist = Math.hypot(stone.x - cx, stone.y - cy);
  shake.trigger(4, 100);
  if (!isMuted()) sound.tone(90, 0.16, "sawtooth", 0.16);
  if (dist > R * cfg.houseScale) { attemptFail("조금 빗나갔어요! 한 번 더"); return; }
  const val = ringVals[ringIndexAt(dist, R * cfg.houseScale)];
  if (val === needVal) {
    spawnParticles(particles, stone.x, stone.y, { count: 14, colors: ["#ffd166", "#fff"], speed: 200, life: 400 });
    if (!isMuted()) sound.pop();
    roundSuccess();
  } else {
    attemptFail(`${val}칸이에요! 한 번 더`);
  }
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  document.getElementById("resultMedal").textContent = medal;
  document.getElementById("resultTitle").textContent = `${label}! 수고했어요`;
  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((ctx, w, h) => drawPhotoOverlay(ctx, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학올림픽_컬링_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학올림픽_컬링_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

// 모션: 엄지-검지 핀치 거리로 "잡음" 판정, 중간점을 커서로 사용
// 터치/마우스: 누르고 있는 동안 = 잡음
function gripState(handResult) {
  if (mode === "motion") {
    if (!handResult || !handResult.landmarks || !handResult.landmarks.length) return { gripped: false, x: 0, y: 0 };
    const lm = handResult.landmarks[0];
    const dNorm = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
    const midNorm = { x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 };
    const pt = toMirroredCanvas(midNorm, dims.w, dims.h, video);
    return { gripped: dNorm < PINCH_THRESHOLD, x: pt.x, y: pt.y };
  }
  const gripped = !!(pointerInput && pointerInput.down && pointerInput.points.length);
  const pt = gripped ? pointerInput.points[0] : { x: 0, y: 0 };
  return { gripped, x: pt.x, y: pt.y };
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawFallbackBackground(ctx, w, h);

  let handResult = null;
  if (mode === "motion") {
    handResult = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (handResult && handResult.landmarks) for (const lm of handResult.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  const grip = gripState(handResult);

  if (state === "playing") stepGame(tsMs, grip);

  // 커서(잡는 손) 표시
  if (grip.gripped) {
    ctx.beginPath();
    ctx.arc(grip.x, grip.y, 18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,183,3,0.7)";
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
  }
  ctx.restore();
}

function drawIntro(ctx, w, h) {
  ctx.save();
  ctx.fillStyle = "#00000090";
  ctx.fillRect(0, 0, w, h);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
  ctx.font = `900 ${fluidPx(dims, 50)}px sans-serif`;
  ctx.fillText("6 + ? = 10", w / 2, h * 0.4);
  ctx.fillStyle = "#ffd166";
  ctx.font = `bold ${fluidPx(dims, 24)}px sans-serif`;
  ctx.fillText("🥌 빈칸을 채우는 수 자리에 스톤을 굴려요!", w / 2, h * 0.53);
  if (charImg) {
    const ch = Math.min(h * 0.32, w * 0.4);
    const cw = ch * (charImg.naturalWidth / charImg.naturalHeight);
    ctx.drawImage(charImg, w / 2 - cw / 2, h * 0.58, cw, ch);
  }
  ctx.restore();
}

// 수를 점으로도 함께 보여준다 — 글자를 못 읽어도 개수를 세어 알 수 있게
function drawCountDots(ctx, x, y, n, r) {
  const perRow = 5, rows = Math.ceil(n / perRow);
  ctx.save();
  ctx.fillStyle = "#1d2b4d";
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, n - row * perRow);
    ctx.beginPath();
    ctx.arc(x + (col - (inRow - 1) / 2) * r * 2.6, y + (row - (rows - 1) / 2) * r * 2.6, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 십틀(ten-frame): 초1 교과서의 10 가르기·모으기 교구. 채워진 칸과 빈칸을 한눈에 보여 준다.
function drawTenFrame(ctx, w, topY, filled) {
  const cell = fluidPx(dims, 40, { min: 22, max: 48 });
  const frameW = cell * 5, frameH = cell * 2;
  const x0 = w / 2 - frameW / 2, y0 = topY;
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.beginPath(); ctx.roundRect(x0 - 8, y0 - 8, frameW + 16, frameH + 16, 12); ctx.fill();
  ctx.strokeStyle = "#1d2b4d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x0 - 8, y0 - 8, frameW + 16, frameH + 16, 12); ctx.stroke();
  for (let i = 0; i < 10; i++) {
    const x = x0 + (i % 5) * cell, y = y0 + Math.floor(i / 5) * cell;
    ctx.strokeStyle = "#1d2b4d"; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, cell, cell);
    ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, cell * 0.30, 0, Math.PI * 2);
    if (i < filled) {
      ctx.fillStyle = "#4cc9f0"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#1d2b4d"; ctx.stroke();
    } else {
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = "#ef476f"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
  return y0 + frameH;
}

// 하우스를 동심원 3개 링으로 그리고, 링마다 후보 수를 "숫자 + 점"으로 위쪽 호에 적는다.
// 스톤은 아래에서 곧게 올라오므로 파워 조절만으로 원하는 링을 고를 수 있다.
function drawHouse(ctx, cx, cy, R, hint, now) {
  const ringColors = ["#ffcbd6", "#c6f0d9", "#a5dcf7"]; // [0]=가장 안쪽
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
  ctx.strokeStyle = "#1d2b4d"; ctx.lineWidth = 3; ctx.stroke();
  // 바깥 링부터 채워 안쪽 링이 위에 덮이게 한다
  for (let i = RINGS - 1; i >= 0; i--) {
    const r = R * ((i + 1) / RINGS);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = ringColors[i % ringColors.length]; ctx.fill();
    if (hint && ringVals[i] === needVal) {
      ctx.save();
      ctx.globalAlpha = 0.28 + Math.sin(now / 260) * 0.2;
      ctx.fillStyle = "#ffd166"; ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = "#1d2b4d"; ctx.lineWidth = 3; ctx.stroke();
  }
  // 각 링의 라벨은 링 두께 한가운데(위쪽)에 얹는다
  const band = R / RINGS;
  const numSize = Math.max(13, Math.min(band * 0.52, fluidPx(dims, 30, { min: 15, max: 36 })));
  const dotR = Math.max(2, band * 0.075);
  for (let i = 0; i < RINGS; i++) {
    const v = ringVals[i];
    const ry = cy - band * (i + 0.5);
    ctx.font = `900 ${numSize}px sans-serif`;
    const numW = ctx.measureText(String(v)).width;
    const dotsW = Math.min(5, v) * dotR * 2.6;
    const gap = dotR * 2.4;
    const total = numW + gap + dotsW;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#1d2b4d";
    ctx.fillText(v, cx - total / 2, ry);
    drawCountDots(ctx, cx - total / 2 + numW + gap + dotsW / 2, ry, v, dotR);
  }
  ctx.restore();
}

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function stepGame(tsMs, grip) {
  const { ctx, w, h } = dims;
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  if (now < introUntil) { drawIntro(ctx, w, h); return; }
  const { cx, cy, R } = houseGeom();
  const cfg = roundConfigForLevel(autoDiff.level);
  const scale = cfg.houseScale;
  const home = stoneHomePos();

  // 문제(십틀 + 식)를 먼저 그린다 — 아래 요소들과 겹치지 않도록 배너 높이를 받아 이어 붙인다
  const bannerBottom = drawHudBanner(ctx, dims, [
    { text: `${filledVal} + ? = 10`, size: 34, weight: "900", color: "#1d2b4d" },
    { text: `🔥${combo}   기록 ${count}번   ⏱ ${Math.ceil(remain / 1000)}초   🥌 기회 ${attemptsLeft}`, size: 15, color: "#e8590c" },
  ]);
  drawTenFrame(ctx, w, bannerBottom + fluidPx(dims, 14, { min: 8, max: 20 }), filledVal);

  // 힘 조절 방식: 파워 게이지가 자동으로 0↔1을 오가고, 원하는 순간에 한 번만 누르면(핀치/터치)
  // 그 세기로 스톤이 하우스 쪽으로 곧게 굴러간다. 드래그 정확도가 필요 없어 1학년도 쉽게 조절할 수 있다.
  const FRICTION = Math.min(w, h) * 0.45;
  const houseDist = home.y - cy;                       // 홈에서 하우스 중심까지 거리
  const reach = R * scale * 1.15;                      // 이 범위 안에서 파워로 조절
  const minDist = Math.max(20, houseDist - reach), maxDist = houseDist + reach;
  const powerFrac = charging ? (Math.sin((now - chargeStartAt) / 620) + 1) / 2 : 0;

  // 입력 엣지는 매 프레임 갱신해야 "누른 채로 유지"된 상태가 다음 스톤까지 새어나가지 않는다
  let pressed = false;
  if (mode === "motion") { pressed = grip.gripped && !wasPressed; wasPressed = grip.gripped; }
  else { pressed = !!(pointerInput && pointerInput.consumeJustDown()); }

  if (charging && !stone.moving && !stone.settled) {
    if (pressed) {
      charging = false;
      const targetDist = minDist + (maxDist - minDist) * powerFrac;
      // 등가속 감속에서 정확히 targetDist 만큼 가고 멈추는 초기 속도
      launchStone(0, -Math.sqrt(2 * FRICTION * targetDist));
    }
  }

  if (stone.moving) {
    const spd = Math.hypot(stone.vx, stone.vy);
    if (spd > 1) {
      const decel = FRICTION * (1 / 60);
      const nvx = stone.vx - (stone.vx / spd) * decel;
      const nvy = stone.vy - (stone.vy / spd) * decel;
      stone.vx = (Math.sign(nvx) === Math.sign(stone.vx)) ? nvx : 0;
      stone.vy = (Math.sign(nvy) === Math.sign(stone.vy)) ? nvy : 0;
      stone.x += stone.vx * (1 / 60);
      stone.y += stone.vy * (1 / 60);
      stone.rot += spd * 0.002;
    } else {
      stone.vx = 0; stone.vy = 0;
    }
    const outOfBounds = stone.x < -80 || stone.x > w + 80 || stone.y < -80 || stone.y > h + 80;
    if (outOfBounds) {
      stone.moving = false; stone.settled = true;
      attemptFail("너무 세게! 한 번 더");
    } else if (Math.hypot(stone.vx, stone.vy) < 1) {
      settleStone();
    }
  }

  drawHouse(ctx, cx, cy, R * scale, cfg.hint, now);

  // 정답을 맞힌 순간에만 잠깐 등장 — 평소 플레이 화면에는 캐릭터가 없다
  if (charImg && now < charFlashUntil) {
    const t = 1 - (charFlashUntil - now) / 500;
    const alpha = t < 0.2 ? t / 0.2 : Math.max(0, 1 - (t - 0.6) / 0.4);
    const ch = Math.min(h * 0.24, w * 0.3);
    const cw = ch * (charImg.naturalWidth / charImg.naturalHeight);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(charImg, w * 0.86 - cw / 2, h * 0.42 - ch / 2, cw, ch);
    ctx.restore();
  }

  // 힘 조절 게이지 + 도착 예상 지점 표시(게이지가 움직이는 동안 실시간으로 어디에 멈출지 보여줌)
  if (charging && !stone.moving && !stone.settled) {
    const predictY = home.y - (minDist + (maxDist - minDist) * powerFrac);
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = "#ffd16688"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(home.x, home.y); ctx.lineTo(home.x, predictY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(home.x, predictY, fluidPx(dims, 16, { min: 12, max: 24 }), 0, Math.PI * 2);
    ctx.strokeStyle = "#06d6a0"; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();

    const gaugeW = Math.min(w * 0.55, 340), gaugeH = fluidPx(dims, 22, { min: 16, max: 30 });
    const gx = w / 2 - gaugeW / 2, gy = h * 0.88; // 스톤(홈)과 하단 안내문 사이에 들어가도록
    ctx.save();
    ctx.fillStyle = "#0b0e1fcc";
    ctx.beginPath(); ctx.roundRect(gx, gy, gaugeW, gaugeH, gaugeH / 2); ctx.fill();
    ctx.strokeStyle = "#ffffff55"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = powerFrac < 0.4 ? "#4cc9f0" : powerFrac < 0.8 ? "#06d6a0" : "#ef476f";
    ctx.beginPath(); ctx.roundRect(gx + 2, gy + 2, Math.max(0, (gaugeW - 4) * powerFrac), gaugeH - 4, (gaugeH - 4) / 2); ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = `bold ${fluidPx(dims, 15)}px sans-serif`;
    ctx.fillText("힘 " + Math.round(powerFrac * 100) + "%", w / 2, gy + gaugeH + fluidPx(dims, 17));
    ctx.restore();
  }

  // 스톤
  // 링 한 칸(R/3)보다 스톤이 크면 어느 링에 들어갔는지 눈으로 알기 어려워 작게 잡는다
  const stoneR = fluidPx(dims, 28, { min: 20, max: 38 });
  ctx.save();
  ctx.translate(stone.x, stone.y);
  ctx.rotate(stone.rot);
  if (stoneImg) {
    ctx.drawImage(stoneImg, -stoneR, -stoneR, stoneR * 2, stoneR * 2);
  } else {
    ctx.beginPath(); ctx.arc(0, 0, stoneR, 0, Math.PI * 2);
    ctx.fillStyle = "#ef476f"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#9aa0c0"; ctx.stroke();
  }
  ctx.restore();

  particles = updateParticles(particles, 1 / 60);
  drawParticles(ctx, particles);
  confetti = updateConfetti(confetti, 1 / 60);
  drawConfetti(ctx, confetti);
  popups = updatePopups(popups, 1 / 60);
  drawPopups(ctx, popups);
  bigPopups = updateBigPopups(bigPopups, 1 / 60);
  drawBigPopups(ctx, bigPopups);

  drawVignette(ctx, w, h, 0.18);
  ctx.save();
  ctx.textAlign = "center";
  const hintFont = fluidPx(dims, 14);
  ctx.font = `${hintFont}px sans-serif`;
  ctx.fillStyle = "#1d2b4d"; ctx.shadowColor = "rgba(255,255,255,0.9)"; ctx.shadowBlur = 6;
  ctx.fillText(mode === "motion" ? "🤏 초록 동그라미가 정답 칸에 올 때 손가락을 모아요!" : "👆 초록 동그라미가 정답 칸에 올 때 화면을 눌러요!", w / 2, h - hintFont * 1.4);
  ctx.restore();

  drawLevelBadge(ctx, w, h, autoDiff.level);
}

init();
</script>
